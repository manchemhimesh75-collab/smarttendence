name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --ci --coverage=false

  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
        timeout-minutes: 15

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Link iOS Native Modules
        run: |
          cd ios
          gem install xcodeproj
          ruby link_native_modules.rb

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Simulator)
        run: |
          cd ios
          xcodebuild \
            -workspace AttendanceApp.xcworkspace \
            -scheme AttendanceApp \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            build
        timeout-minutes: 20

      - name: Zip the .app for Simulator
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r AttendanceApp-Simulator.zip AttendanceApp.app

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-simulator
          path: ios/build/Build/Products/Release-iphonesimulator/AttendanceApp-Simulator.zip
          retention-days: 7

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for secrets in code
        run: |
          # Check for common secret patterns
          if grep -r -i "private.key\|secret\|password\|api.key\|token" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" src/ | grep -v ".test." | grep -v "example" | grep -v "placeholder"; then
            echo "⚠️ Potential secrets found in source code!"
            exit 1
          fi
          echo "✅ No obvious secrets in source code"

      - name: Check for hardcoded keys
        run: |
          if grep -r "BEGIN.*PRIVATE KEY\|BEGIN.*PUBLIC KEY" --include="*.ts" --include="*.tsx" src/; then
            echo "⚠️ Hardcoded keys found!"
            exit 1
          fi
          echo "✅ No hardcoded keys"

  # Final status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build-android, build-ios, security-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build-android.result }}" != "success" ]] || \
             [[ "${{ needs.build-ios.result }}" != "success" ]] || \
             [[ "${{ needs.security-check.result }}" != "success" ]]; then
            echo "❌ Some CI jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed"